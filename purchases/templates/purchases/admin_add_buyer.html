{% extends "base.html" %}

{% block title %}Add Buyer{% endblock %}

{% block content %}

<style>
.admin-shell {
    max-width: 700px;
    margin: 0 auto;
    padding: 24px;
}

.section-inner {
    background: #ffffff;
    border-radius: 16px;
    padding: 24px;
    border: 1px solid #e3e9f2;
    box-shadow: 0 6px 18px rgba(16, 24, 40, 0.06);
}

.page-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 4px;
    color: #142033;
}

.page-subtitle {
    font-size: 14px;
    color: #667085;
    margin-bottom: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group.full {
    grid-column: span 2;
}

label {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 4px;
    color: #475467;
}

input {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #d0d7e2;
    font-size: 14px;
}

input:focus {
    outline: none;
    border-color: #002D62;
    box-shadow: 0 0 0 2px rgba(0, 45, 98, 0.12);
}

.btn-row {
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
}

.btn-primary {
    background: #002D62;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
}

.btn-secondary {
    background: #f1f5f9;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
}
</style>

<div class="admin-shell">
    <div class="section-inner">

        <div class="page-title">Add Buyer</div>
        <div class="page-subtitle">
            Create a new buyer account with limited access.
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="form-grid">

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" required>
                </div>

                <div class="form-group">
                    <label>Buyer Code</label>
                    <input type="text" name="buyer_code" placeholder="e.g. JD">
                </div>

                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="first_name">
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="last_name">
                </div>

                <div class="form-group full">
                    <label>Email</label>
                    <input type="email" name="email">
                </div>

                <div class="form-group full">
                    <label>Phone</label>
                    <input type="text" name="phone">
                </div>

            </div>

            <div class="btn-row">
                <a href="{% url 'admin_utilities' %}" class="btn-secondary">Cancel</a>
                <button type="submit" class="btn-primary">Create Buyer</button>
            </div>

        </form>

    </div>
</div>

{% endblock %}
